name: Publiceren

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publiceren
  cancel-in-progress: false

jobs:
  presentatie:
    name: Presentatie online zetten
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Bouwen
        run: |
          node bouw.js
          node spiek.js
          cp Lena-show/Lena-show.html Lena-show/index.html
          cp Spiekbriefje.html Lena-show/spiekbriefje.html
          cp tikken.html Lena-show/tikken.html
          printf "User-agent: *\nDisallow: /\n" > Lena-show/robots.txt

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: Lena-show

      - id: deploy
        uses: actions/deploy-pages@v4
